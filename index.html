<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Page -->
    <div id="loginPage">
        <div class="login-box">
            <h2>Student Login</h2>

            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">

            <button onclick="login()">Login</button>
            <p id="msg"></p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
        <header>
            <h2>Student Management System</h2>
        </header>

        <div class="container">

            <!-- Sidebar -->
            <div class="sidebar">
                <h3>Menu</h3>
                <ul>
                    <li onclick="showHome()">Dashboard</li>
                    <li onclick="showStudent()">Students</li>
                    <li onclick="showCourse()">Courses</li>
                    <li onclick="logout()">Logout</li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="content">

                <!-- Home -->
                <div id="home" class="card">
                    <h2>Welcome</h2>
                    <p>Manage Students and Courses.</p>
                </div>

                <!-- Students -->
                <div id="student" class="card" style="display:none;">
                    <h2>Add Student</h2>

                    <input type="text" id="studentName" placeholder="Student Name">
                    <input type="number" id="studentAge" placeholder="Age">

                    <select id="studentCourse">
                        <option>HTML</option>
                        <option>CSS</option>
                        <option>JavaScript</option>
                        <option>Python</option>
                        <option>Java</option>
                    </select>

                    <button onclick="addStudent()">Add Student</button>

                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Course</th>
                            </tr>
                        </thead>
                        <tbody id="studentTable"></tbody>
                    </table>
                </div>

                <!-- Courses -->
                <div id="course" class="card" style="display:none;">
                    <h2>Available Courses</h2>

                    <ul id="courseList">
                        <li>HTML</li>
                        <li>CSS</li>
                        <li>JavaScript</li>
                        <li>Python</li>
                        <li>Java</li>
                    </ul>

                    <input type="text" id="newCourse" placeholder="New Course">
                    <button onclick="addCourse()">Add Course</button>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
